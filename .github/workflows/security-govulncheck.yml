name: Security Govulncheck

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  resolve_branches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve branches to scan
        id: set-branches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-security-scan-branches.sh

  govulncheck:
    needs: resolve_branches
    name: govulncheck (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.resolve_branches.outputs.branches) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs inspect each maintained branch. Pushes and PRs scan
          # their pushed branch or merge commit so proposed changes are covered.
          ref: ${{ github.event_name == 'schedule' && matrix.branch || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # govulncheck exits non-zero both for reachable vulnerabilities and for
      # scan failures. Capture the output and status so those cases can be
      # reported separately after the issue and artifact steps have run.
      - name: Run govulncheck
        id: scan
        run: |
          set +e
          set -o pipefail
          govulncheck ./... 2>&1 | tee govulncheck-output.txt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classify result
        if: always()
        id: classify
        env:
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          REACHABLE=$(grep -oE 'Your code is affected by [0-9]+ vulnerabilit' govulncheck-output.txt 2>/dev/null \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}') || REACHABLE=0
          COMPLETED=$(grep -cE 'Your code is affected by [0-9]+ vulnerabilit' govulncheck-output.txt 2>/dev/null) || COMPLETED=0

          if [ "${STATUS:-1}" = "0" ] && [ -s govulncheck-output.txt ]; then
            OUTCOME=clean
          elif [ "$COMPLETED" -gt 0 ] && [ "$REACHABLE" -gt 0 ]; then
            OUTCOME=vulnerable
          else
            OUTCOME=error
          fi

          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "reachable=$REACHABLE" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        if: always()
        env:
          BRANCH: ${{ matrix.branch }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          REACHABLE: ${{ steps.classify.outputs.reachable }}
        run: |
          {
            echo "# govulncheck (\`$BRANCH\`)"
            echo
            case "$OUTCOME" in
              clean)
                echo "## ✅ No reachable vulnerabilities"
                echo
                echo "govulncheck found no vulnerable symbols reachable from this code."
                ;;
              vulnerable)
                echo "## ❌ $REACHABLE reachable vulnerabilities"
                echo
                echo "The code reaches vulnerable symbols. Treat these as high-priority findings."
                ;;
              *)
                echo "## ⚠️ Scan did not complete"
                echo
                echo "govulncheck failed before it could report a trustworthy result. This is a scan failure, not a vulnerability finding."
                ;;
            esac
            echo
            echo "<details open>"
            echo "<summary><b>govulncheck output</b></summary>"
            echo
            echo '```'
            head -300 govulncheck-output.txt 2>/dev/null || echo "No output captured."
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save scan result
        if: always()
        env:
          BRANCH: ${{ matrix.branch }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          REACHABLE: ${{ steps.classify.outputs.reachable }}
        run: |
          jq -n --arg branch "$BRANCH" --arg outcome "$OUTCOME" --arg reachable "${REACHABLE:-0}" \
            '{branch:$branch,outcome:$outcome,reachable:$reachable}' > scan-result.json

      - name: Upload govulncheck results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-results-${{ strategy.job-index }}
          path: |
            govulncheck-output.txt
            scan-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if govulncheck found vulnerabilities or could not complete
        if: always() && steps.classify.outputs.outcome != 'clean'
        run: exit 1

  attest-results:
    needs: [resolve_branches, govulncheck]
    if: always() && !cancelled() && github.event_name != 'pull_request'
    name: Attest govulncheck results (${{ matrix.branch }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.resolve_branches.outputs.branches) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: govulncheck-results-${{ strategy.job-index }}
          path: scan-results

      - name: Bundle scan results
        run: tar -czf govulncheck-results.tar.gz -C scan-results govulncheck-output.txt scan-result.json

      - name: Attest scan results
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: govulncheck-results.tar.gz

      - name: Upload attested results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-attested-${{ strategy.job-index }}
          path: govulncheck-results.tar.gz
          if-no-files-found: error
          retention-days: 30

  create-issues:
    needs: [resolve_branches, govulncheck, attest-results]
    if: always() && !cancelled() && github.event_name != 'pull_request'
    permissions:
      contents: read
      attestations: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download attested scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: govulncheck-attested-*
          path: govuln-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Create or update issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_BRANCHES: ${{ needs.resolve_branches.outputs.branches }}
        run: bash .github/scripts/report-govulncheck-results.sh
