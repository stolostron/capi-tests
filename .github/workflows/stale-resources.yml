name: Stale Resource Detection

# Scheduled workflow to detect stale cloud resources left by test runs.
# Scans Azure for resources older than a configurable threshold.
# On detection: fails the workflow and creates/updates a Jira issue.
#
# Requires:
#   - Environment (aro-stage) with Azure credentials
#   - Repository secrets: JIRA_EMAIL, JIRA_API_TOKEN (for Jira integration)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-stale-resources.sh'
      - 'test/stale_resources_test.go'
      - '.github/workflows/stale-resources.yml'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Staleness threshold in hours'
        required: false
        default: '24'
        type: string

permissions:
  contents: read

env:
  MAX_AGE_HOURS: ${{ inputs.max_age_hours || '24' }}

jobs:
  regression-tests:
    name: Stale resource regression tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Test detector and workflow reporting without Azure access
      run: |
        shellcheck scripts/check-stale-resources.sh
        go test -mod=mod ./test -run '^TestStaleResource' -count=1

  check-azure:
    name: Check Azure Resources
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aro-stage
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    outputs:
      stale_found: ${{ steps.check.outputs.stale_found }}
      report_found: ${{ steps.check.outputs.report_found }}
      report: ${{ steps.check.outputs.report }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate Azure credentials
      id: azure-creds
      run: |
        CONFIGURED=true
        missing=""
        [ -z "$AZURE_TENANT_ID" ] && missing="$missing vars.AZURE_TENANT_ID"
        [ -z "$AZURE_SUBSCRIPTION_ID" ] && missing="$missing vars.AZURE_SUBSCRIPTION_ID"
        [ -z "$AZURE_CLIENT_ID" ] && missing="$missing vars.AZURE_CLIENT_ID"
        [ -z "$AZURE_CLIENT_SECRET" ] && missing="$missing secrets.AZURE_CLIENT_SECRET"
        if [ -n "$missing" ]; then
          echo "::warning::Missing Azure credentials:$missing"
          echo "Configure in Settings > Environments > aro-stage"
          CONFIGURED=false
        fi

        echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
        if [ "$CONFIGURED" = "false" ]; then
          echo "::notice::Azure credentials not configured — skipping Azure check"
          echo "stale_found=false" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<SUMMARY_EOF'
            echo "Azure check skipped: credentials not configured"
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

    - name: Azure CLI login
      if: steps.azure-creds.outputs.configured == 'true'
      run: |
        echo "::add-mask::${AZURE_CLIENT_SECRET}"
        az login --service-principal \
          --username "$AZURE_CLIENT_ID" \
          --password "$AZURE_CLIENT_SECRET" \
          --tenant "$AZURE_TENANT_ID" \
          --output none
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"

    - name: Check for stale Azure resources
      id: check
      if: steps.azure-creds.outputs.configured == 'true'
      run: |
        set +e
        RESULT=$(./scripts/check-stale-resources.sh --azure --json --max-age "$MAX_AGE_HOURS" 2>azure-check.stderr)
        EXIT_CODE=$?
        set -e

        if ! echo "$RESULT" | jq -e . >/dev/null 2>&1; then
          echo "::error::Invalid JSON output from check script"
          cat azure-check.stderr >&2 || true
          echo "stale_found=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        JSON_RESULT="$RESULT"

        STALE=$(echo "$JSON_RESULT" | jq -r '.stale_found')
        SUMMARY=$(echo "$JSON_RESULT" | jq -r '.summary')

        echo "stale_found=$STALE" >> "$GITHUB_OUTPUT"
        REPORT_FOUND=$(echo "$JSON_RESULT" | jq '
          .stale_found or (.scan_complete == false) or
          ([.azure.unknown_age_resource_groups[], .azure.deleting_resource_groups[],
            .azure.disappeared_resource_groups[]] | length > 0)')
        echo "report_found=$REPORT_FOUND" >> "$GITHUB_OUTPUT"
        {
          echo 'summary<<SUMMARY_EOF'
          echo "$SUMMARY"
          echo 'SUMMARY_EOF'
        } >> "$GITHUB_OUTPUT"

        # Write report to file (outputs have size limits)
        echo "$JSON_RESULT" > azure-report.json
        {
          echo 'report<<REPORT_EOF'
          echo "$JSON_RESULT"
          echo 'REPORT_EOF'
        } >> "$GITHUB_OUTPUT"

        if [ "$EXIT_CODE" -gt 1 ]; then
          echo "::error::Azure resource scan incomplete — see report for lookup errors"
          cat azure-check.stderr >&2 || true
          exit 1
        fi

    - name: Upload Azure report
      if: always() && steps.check.outputs.report_found == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: azure-stale-report
        path: azure-report.json
        retention-days: 30

  report:
    name: Report Findings
    needs: [check-azure]
    if: always() && needs.check-azure.outputs.report_found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_ASSIGNEE_ACCOUNT_ID: ${{ vars.JIRA_ASSIGNEE_ACCOUNT_ID }}
      JIRA_PARENT_KEY: ${{ vars.JIRA_STALE_PARENT_KEY }}
      AZURE_STALE: ${{ needs.check-azure.outputs.stale_found }}
      AZURE_SUMMARY: ${{ needs.check-azure.outputs.summary }}
      AZURE_REPORT: ${{ needs.check-azure.outputs.report }}
    steps:
    - name: Generate step summary
      run: |
        {
          echo "# Stale Resource Detection Results"
          echo ""
          echo "**Threshold:** ${MAX_AGE_HOURS} hours"
          echo "$AZURE_REPORT" | jq -r '"**Observed at:** \(.observed_at) (UTC)", "**Subscription:** \(.subscription_id)", "**Scan complete:** \(.scan_complete)"'
          echo ""
          echo "$AZURE_SUMMARY"
          echo ""
          echo "Unknown-age groups and groups being deleted are informational; they do not fail the stale-resource check. Lookup errors fail the scan as incomplete."
          echo ""

          for CATEGORY in resource_groups unknown_age_resource_groups deleting_resource_groups disappeared_resource_groups; do
            COUNT=$(echo "$AZURE_REPORT" | jq --arg category "$CATEGORY" '.azure[$category] | length')
            if [ "$COUNT" -eq 0 ]; then
              continue
            fi
            case "$CATEGORY" in
              resource_groups) TITLE="Confirmed stale resource groups" ;;
              unknown_age_resource_groups) TITLE="Unknown-age resource groups" ;;
              deleting_resource_groups) TITLE="Resource groups being deleted" ;;
              disappeared_resource_groups) TITLE="Resource groups that disappeared during the scan" ;;
            esac
            echo "### $TITLE"
            echo ""
            echo "| Name | Location | Created At | State | User | Env |"
            echo "|------|----------|------------|-------|------|-----|"
            echo "$AZURE_REPORT" | jq -r --arg category "$CATEGORY" '.azure[$category][] | "| \(.name) | \(.location // "-") | \(.createdAt // "unknown") | \(.provisioningState // "absent") | \(.user // "-") | \(.env // "-") |"'
            echo ""
          done

          for CATEGORY in ad_applications service_principals; do
            COUNT=$(echo "$AZURE_REPORT" | jq --arg category "$CATEGORY" '.azure[$category] | length')
            if [ "$COUNT" -eq 0 ]; then
              continue
            fi
            case "$CATEGORY" in
              ad_applications) TITLE="AD Applications" ;;
              service_principals) TITLE="Service Principals" ;;
            esac
            echo "### $TITLE"
            echo ""
            echo "| Display Name | App ID | Created At |"
            echo "|-------------|--------|------------|"
            echo "$AZURE_REPORT" | jq -r --arg category "$CATEGORY" '.azure[$category][] | "| \(.displayName) | \(.appId) | \(.createdAt) |"'
            echo ""
          done

          if [ "$(echo "$AZURE_REPORT" | jq '.errors | length')" -gt 0 ]; then
            echo "### Scan errors"
            echo ""
            echo "$AZURE_REPORT" | jq -r '.errors[] | "- \(.context): \(.message)"'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create or update Jira issue
      if: env.AZURE_STALE == 'true' && env.JIRA_EMAIL != '' && env.JIRA_API_TOKEN != ''
      run: |
        echo "::add-mask::${JIRA_API_TOKEN}"
        TODAY=$(date +%Y-%m-%d)
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # Build description from findings (use $'...' for actual newlines)
        DESCRIPTION=$'Stale cloud resources detected by automated scan on '"${TODAY}"$'.\n\n'
        DESCRIPTION+=$'*Workflow run:* '"${RUN_URL}"$'\n'
        DESCRIPTION+=$'*Threshold:* '"${MAX_AGE_HOURS}"$' hours\n\n'

        if [ "$AZURE_STALE" = "true" ]; then
          DESCRIPTION+=$'h3. Azure\n'"${AZURE_SUMMARY}"$'\n\n'
        fi

        DESCRIPTION+=$'Please investigate and clean up the leaked resources.\n'
        DESCRIPTION+="Use {{make clean-azure}} or {{./scripts/cleanup-azure-resources.sh}} for Azure cleanup."

        # Search for existing open stale-resources issue under the configured parent
        SEARCH_RESPONSE=$(curl -s -w "\n%{http_code}" -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
          -G "https://redhat.atlassian.net/rest/api/3/search/jql" \
          --data-urlencode "jql=parent = ${JIRA_PARENT_KEY} AND summary ~ \"\\\"[Stale Resources]\\\"\" AND status != Closed" \
          --data-urlencode "fields=key,summary,status" \
          -H "Content-Type: application/json" 2>/dev/null)

        SEARCH_HTTP_CODE=$(echo "$SEARCH_RESPONSE" | tail -1)
        SEARCH_RESULT=$(echo "$SEARCH_RESPONSE" | sed '$d')
        if [ "$SEARCH_HTTP_CODE" -lt 200 ] || [ "$SEARCH_HTTP_CODE" -ge 300 ]; then
          echo "::warning::Jira search failed (HTTP ${SEARCH_HTTP_CODE}); skipping create/update to avoid duplicates"
          exit 0
        fi

        EXISTING_KEY=$(echo "$SEARCH_RESULT" | jq -r '.issues[0].key // empty' 2>/dev/null)

        # Validate Jira key format before using in API URL
        if [ -n "$EXISTING_KEY" ] && ! echo "$EXISTING_KEY" | grep -qE '^[A-Z]+-[0-9]+$'; then
          echo "::warning::Unexpected Jira issue key format: ${EXISTING_KEY} — skipping update"
          EXISTING_KEY=""
        fi

        if [ -n "$EXISTING_KEY" ]; then
          echo "Found existing Jira issue: ${EXISTING_KEY} — adding comment"

          COMMENT=$'Stale resources detected again on '"${TODAY}"$'.\n\n'
          if [ "$AZURE_STALE" = "true" ]; then
            COMMENT+=$'*Azure:* '"${AZURE_SUMMARY}"$'\n'
          fi
          COMMENT+=$'\n*Workflow run:* '"${RUN_URL}"

          COMMENT_JSON=$(jq -n --arg body "$COMMENT" '{"body": $body}')

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /dev/null \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -X POST "https://redhat.atlassian.net/rest/api/2/issue/${EXISTING_KEY}/comment" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_JSON")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Comment added to ${EXISTING_KEY}"
          else
            echo "::warning::Failed to add comment to ${EXISTING_KEY} (HTTP ${HTTP_CODE})"
          fi
        else
          echo "No existing Jira issue found — creating new subtask"

          ISSUE_JSON=$(jq -n \
            --arg summary "[Stale Resources] Leaked cloud resources detected (${TODAY})" \
            --arg description "$DESCRIPTION" \
            --arg assignee "${JIRA_ASSIGNEE_ACCOUNT_ID:-5fabb5fdecdae600685b01d6}" \
            --arg parent "$JIRA_PARENT_KEY" \
            '{
              "fields": {
                "project": {"key": "ARO"},
                "parent": {"key": $parent},
                "issuetype": {"name": "Sub-task"},
                "summary": $summary,
                "description": $description,
                "labels": ["CAPZ", "QE"],
                "components": [{"id": "37592"}],
                "security": {"id": "10034"},
                "assignee": {"accountId": $assignee},
                "customfield_10464": {"id": "10608"}
              }
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -X POST "https://redhat.atlassian.net/rest/api/2/issue" \
            -H "Content-Type: application/json" \
            -d "$ISSUE_JSON")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 201 ]; then
            ISSUE_KEY=$(echo "$BODY" | jq -r '.key')
            echo "Created Jira issue: ${ISSUE_KEY}"
            echo "https://redhat.atlassian.net/browse/${ISSUE_KEY}"
          else
            echo "::warning::Failed to create Jira issue (HTTP ${HTTP_CODE}): ${BODY}"
          fi
        fi

    - name: Fail workflow
      if: env.AZURE_STALE == 'true'
      run: |
        echo "::error::Stale cloud resources detected — see step summary for details"
        exit 1
