name: Security Trivy

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  resolve_branches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve branches to scan
        id: set-branches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-security-scan-branches.sh

  scan:
    needs: resolve_branches
    name: Trivy (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.resolve_branches.outputs.branches) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs inspect each maintained branch. Pushes and PRs scan
          # their pushed branch or merge commit so proposed changes are covered.
          ref: ${{ github.event_name == 'schedule' && matrix.branch || github.ref }}

      - name: Run Trivy vulnerability scanner (SARIF)
        id: sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (JSON)
        id: json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
        continue-on-error: true

      - name: Classify scan result
        id: summarize
        if: always()
        env:
          BRANCH: ${{ matrix.branch }}
          TRIVY_JSON_OUTCOME: ${{ steps.json.outcome }}
        run: bash .github/scripts/summarize-trivy.sh

      - name: Upload Trivy results (SARIF)
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy/${{ matrix.branch }}
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-${{ strategy.job-index }}
          path: |
            scan-summary.json
            trivy-results.json
            trivy-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Fail if scan is vulnerable or incomplete
        if: always() && steps.summarize.outputs.outcome != 'clean'
        run: |
          echo "::error::Trivy reported findings or did not complete for ${{ matrix.branch }}."
          exit 1

  create-issues:
    needs: [resolve_branches, scan]
    if: always() && !cancelled() && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trivy-results-*
          path: trivy-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Create or update issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_BRANCHES: ${{ needs.resolve_branches.outputs.branches }}
        run: bash .github/scripts/report-trivy-results.sh
