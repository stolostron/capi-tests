name: Schedule Full Cluster Deployment (ARO)
run-name: ARO nightly deployment gate (${{ github.ref_name }})

# Run the full deployment workflow only when main has changed since its last
# successful deployment. Keeping this gate separate means a no-change run is
# reported as a successful scheduling decision, not as a successful deployment.
on:
  schedule:
    - cron: '0 2 * * *'

permissions:
  actions: write

jobs:
  nightly-deployment-gate:
    name: Check changes and dispatch deployment
    runs-on: ubuntu-latest
    steps:
    - name: Check for changes since last successful deployment
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW_FILE: workload-cluster-aro.yml
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
      run: |
        LAST_SUCCESS_SHA=$(gh run list \
          --workflow "$WORKFLOW_FILE" \
          --repo "$REPO" \
          --branch "$BRANCH" \
          --status success \
          --json headSha \
          --jq '.[0].headSha // empty' 2>/dev/null || true)

        if [ -z "$LAST_SUCCESS_SHA" ]; then
          echo "No previous successful deployment found — dispatching workflow"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CURRENT_SHA="${{ github.sha }}"
        if [ "$LAST_SUCCESS_SHA" = "$CURRENT_SHA" ]; then
          echo "No new commits since last successful deployment ($LAST_SUCCESS_SHA)"
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "New commits detected: $LAST_SUCCESS_SHA..$CURRENT_SHA"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Dispatch the full-cluster workflow when needed
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        WORKFLOW_FILE: workload-cluster-aro.yml
        HAS_CHANGES: ${{ steps.check.outputs.has_changes }}
      run: |
        if [ "$HAS_CHANGES" = "true" ]; then
          echo "Changes detected; dispatching the full-cluster workflow."
          gh workflow run "$WORKFLOW_FILE" --repo "$REPO" --ref "$BRANCH"
        else
          {
            echo "## No full-cluster deployment was started"
            echo
            echo "No code changes were detected since the last successful deployment."
            echo "No cluster tests ran; this run only checked whether a deployment was needed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "No changes detected; no full-cluster deployment was started."
        fi
